# ============================================================================
# HARNESS STEP GROUP TEMPLATE: Send Email  (CD / Custom stage) -- via plugins/email
# ============================================================================
# Same plugins/email image as the CI version, but a Plugin step in a CD or
# Custom stage must run inside a *containerized step group* backed by
# Kubernetes -- that's a platform requirement, not something this template
# can avoid. This template bundles the step group + K8s infra binding
# together, so callers just supply their K8s connector once.
#
# This is a StepGroup template rather than a plain Step template for that
# reason -- the infra binding (stepGroupInfra) lives at the group level, not
# on the individual step, so a lone Step template can't carry it.
#
# Scope: Account. spec.stageType: Custom -- duplicate with stageType:
# Deployment if you also want to drop this into CD Deploy stages.
#
# BEFORE FIRST USE:
#   - k8sConnectorRef / namespace: point at your existing Kubernetes infra.
#   - imageConnectorRef: a Docker-Hub-capable registry connector (default
#     guess: account.harnessImage).
#   - host/port/username/password: your existing SMTP setup.
#   - Same recipients/attachments/Cc caveats as the CI template -- see its
#     header comment.
#
# USAGE from a calling pipeline (Custom stage):
#   - stepGroup:
#       name: Notify team
#       identifier: notify_team
#       template:
#         templateRef: account.Send_Email_CD_Plugin_SG   # match wherever you save it
#         versionLabel: "1.0.0"
#         templateInputs:
#           type: StepGroup
#           spec:
#             steps:
#               - step:
#                   identifier: send_email
#                   type: Plugin
#                   spec:
#                     settings:
#                       recipients: dev-team@example.com,lead@example.com
#                       subject: "Pipeline <+pipeline.name> - <+pipeline.status>"
#                       body: |-
#                         <p>Hi team,</p>
#                         <ul><li>Status: <+pipeline.status></li></ul>
#                         <hr>
#                         <p style="font-size:12px;color:#888">
#                         Pipeline <+pipeline.name>, build #<+pipeline.sequenceId>,
#                         triggered by <+pipeline.triggeredBy.name>.<br>
#                         <a href="<+pipeline.executionUrl>">View this run</a>
#                         </p>
#                       host: smtp.yourprovider.com
#                       username: pipelines@yourcompany.com
#                       password: <+secrets.getValue("smtp_password")>
#             stepGroupInfra:
#               spec:
#                 connectorRef: your_k8s_connector
#                 namespace: harness-delegate
# ============================================================================
template:
  name: Send Email (CD-Custom - Plugin)
  identifier: Send_Email_CD_Plugin_SG
  versionLabel: 1.0.0
  type: StepGroup
  tags:
    category: notification
  spec:
    stageType: Custom
    sharedPaths: []
    steps:
    - step:
        name: Send Email
        identifier: send_email
        type: Plugin
        spec:
          connectorRef: <+input>.default("account.harnessImage")
          image: plugins/email:3.0.0
          settings:
            host: <+input>
            port: <+input>.default("587")
            username: <+input>.default("")
            password: <+input>.default("")
            skip_verify: <+input>.default("false")
            from.address: <+input>.default("pipelines@yourcompany.com")
            from.name: <+input>.default("Harness Pipelines")
            recipients: <+input>
            recipients_only: <+input>.default("true")
            subject: <+input>
            body: <+input>
            attachments: <+input>.default("")
    stepGroupInfra:
      type: KubernetesDirect
      spec:
        connectorRef: <+input>
        namespace: <+input>.default("harness-delegate")
