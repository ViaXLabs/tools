# Same shape as psa-java-ci.yaml -- build once, push to Nexus (primary)
# and ECR (backup only, nothing ever pulls from it).
pipeline:
  name: psa-python-ci
  identifier: psa_python_ci
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  variables:
    - name: environment
      type: String
      value: <+input>
    - name: nexus_registry
      type: String
      value: <+input>

  stages:
    - stage:
        name: Build
        identifier: build
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  name: Push to Nexus
                  identifier: push_nexus
                  template:
                    templateRef: build_and_push_image
                    versionLabel: v1
                    templateInputs:
                      spec:
                        spec:
                          connectorRef: account.psa_nexus_connector
                          repo: <+pipeline.variables.nexus_registry>/psa-<+pipeline.variables.environment>-python
                          tags:
                            - <+pipeline.sequenceId>
                          dockerfile: apps/psa-python/Dockerfile
                          context: apps/psa-python

              - step:
                  name: Push to ECR (backup)
                  identifier: push_ecr_backup
                  template:
                    templateRef: build_and_push_ecr_backup
                    versionLabel: v1
                    templateInputs:
                      spec:
                        spec:
                          connectorRef: account.psa_ecr_connector
                          region: us-east-1
                          account: <+input>
                          imageName: psa-<+pipeline.variables.environment>-python
                          tags:
                            - <+pipeline.sequenceId>
                          dockerfile: apps/psa-python/Dockerfile
                          context: apps/psa-python
