# CI only -- builds the image and pushes it to Nexus (the registry the CD
# pipelines actually deploy from) and, as a backup copy, to ECR. Nothing
# ever pulls from the ECR copy; it exists purely so an image survives if
# Nexus is ever unavailable.
#
# This does NOT apply any Terraform or deploy anything -- that's
# psa-java-ecs.yaml / psa-java-eks.yaml. Wire this pipeline's success to
# those via a Harness Pipeline trigger passing image_tag = <+pipeline.sequenceId>,
# or trigger them manually with that same tag.
pipeline:
  name: psa-java-ci
  identifier: psa_java_ci
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  variables:
    - name: environment
      type: String
      value: <+input>
    - name: nexus_registry
      type: String
      value: <+input>

  stages:
    - stage:
        name: Build
        identifier: build
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  name: Push to Nexus
                  identifier: push_nexus
                  template:
                    templateRef: build_and_push_image
                    versionLabel: v1
                    templateInputs:
                      spec:
                        spec:
                          connectorRef: account.psa_nexus_connector
                          repo: <+pipeline.variables.nexus_registry>/psa-<+pipeline.variables.environment>-java
                          tags:
                            - <+pipeline.sequenceId>
                          dockerfile: apps/psa-java/Dockerfile
                          context: apps/psa-java

              - step:
                  name: Push to ECR (backup)
                  identifier: push_ecr_backup
                  template:
                    templateRef: build_and_push_ecr_backup
                    versionLabel: v1
                    templateInputs:
                      spec:
                        spec:
                          connectorRef: account.psa_ecr_connector
                          region: us-east-1
                          account: <+input>
                          imageName: psa-<+pipeline.variables.environment>-java
                          tags:
                            - <+pipeline.sequenceId>
                          dockerfile: apps/psa-java/Dockerfile
                          context: apps/psa-java
