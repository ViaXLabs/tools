# CD only -- see psa-java-ecs.yaml for the full explanation. Same
# pattern, python app, ECS target.
pipeline:
  name: psa-python-ecs
  identifier: psa_python_ecs
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  variables:
    - name: environment
      type: String
      value: <+input>
    - name: nexus_registry
      type: String
      value: <+input>
    - name: image_tag
      type: String
      value: <+input>
      description: The tag psa-python-ci just pushed to Nexus for this app

  stages:
    - stage:
        name: Foundation
        identifier: foundation
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Apply foundation
                  identifier: apply_foundation
                  template:
                    templateRef: terraform_apply
                    versionLabel: v1
                    templateInputs:
                      spec:
                        spec:
                          configuration:
                            spec:
                              workspace: psa-<+pipeline.variables.environment>-foundation
                              configFiles:
                                store:
                                  spec:
                                    folderPath: terraform/live/<+pipeline.variables.environment>/foundation
                              varFiles:
                                - varFile:
                                    spec:
                                      content: ""
                          provisionerIdentifier: psa_<+pipeline.variables.environment>_foundation

    - stage:
        name: ECS infra
        identifier: ecs_infra
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Apply ECS
                  identifier: apply_ecs
                  template:
                    templateRef: terraform_apply
                    versionLabel: v1
                    templateInputs:
                      spec:
                        spec:
                          configuration:
                            spec:
                              workspace: psa-<+pipeline.variables.environment>-ecs
                              configFiles:
                                store:
                                  spec:
                                    folderPath: terraform/live/<+pipeline.variables.environment>/ecs
                              varFiles:
                                - varFile:
                                    spec:
                                      content: |
                                        python_image_uri = "<+pipeline.variables.nexus_registry>/psa-<+pipeline.variables.environment>-python:<+pipeline.variables.image_tag>"
                          provisionerIdentifier: psa_<+pipeline.variables.environment>_ecs

    - stage:
        name: Verify
        identifier: verify
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Deploy and verify
                  identifier: deploy_and_verify
                  template:
                    templateRef: deploy_and_verify
                    versionLabel: v1
                    templateInputs:
                      spec:
                        envVariables:
                          HEALTH_URL: <+input>
                          NEW_RELIC_APP_NAME: psa-python-<+pipeline.variables.environment>
