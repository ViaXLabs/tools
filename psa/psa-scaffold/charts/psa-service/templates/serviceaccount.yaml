{{- if .Values.serviceAccount.create }}
# CHART: charts/psa-service (templates/serviceaccount.yaml)
# The eks.amazonaws.com/role-arn annotation (set via
# serviceAccount.annotations in values, populated by Terraform's
# irsa_role_arn) is what wires up IRSA -- it's how pods running under
# this service account get AWS permissions without static credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "psa.fullname" . }}
  labels:
    {{- include "psa.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
