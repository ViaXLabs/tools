# Every PSA app overrides these via the helm_release resource in
# terraform/modules/eks-workload -- nothing here should need editing by
# hand for a normal deploy. It exists so `helm template`/`helm install`
# still work standalone for local testing.

image:
  repository: ""
  tag: "latest"

replicaCount: 1

containerPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi

# Plain (non-secret) env vars, as a list of {name, value}
env: []

# Optional: pull an entire k8s Secret in as env vars, e.g. [{secretRef: {name: psa-java-secrets}}]
envFrom: []

serviceAccount:
  create: true
  annotations: {}
  # eks.amazonaws.com/role-arn: set via Terraform for IRSA

# Name of a k8s Secret (type kubernetes.io/dockerconfigjson) holding Nexus
# pull credentials, synced into the namespace by External Secrets. Empty
# means no imagePullSecrets are attached (fine for a public registry, not
# for Nexus).
imagePullSecret: ""

service:
  port: 80

ingress:
  enabled: true
  host: ""
  className: alb
