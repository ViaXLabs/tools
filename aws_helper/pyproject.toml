[project]
name = "awsx"
version = "0.1.0"
description = "Extensible AWS helper CLI for multi-step, cross-account, and audit operations beyond the standard AWS CLI"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34.0",
    "click>=8.1.0",
]

[project.scripts]
awsx = "awsx.cli:main"
awsx-ro = "awsx.cli:main_readonly"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["awsx*"]
